<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tienda Mixta Naturavena</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8f1;--card:#fff;--ink:#1c2b22;--mut:#586a5e;--g:#1f6b45;--y:#f5c542;--yi:#3b2f00;--bd:#d3e0cb;--soft:#e6f0e0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121c16;--card:#1b2a21;--ink:#eaf2e8;--mut:#a3b5a8;--bd:#2c4033;--soft:#223329;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121c16;--card:#1b2a21;--ink:#eaf2e8;--mut:#a3b5a8;--bd:#2c4033;--soft:#223329;color-scheme:dark}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:10}
body.own{padding-bottom:90px}
h1,h2,h3,.brand{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;line-height:1.1;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--g);color:#fff;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;padding:8px 20px}
.brand{font-size:1.35rem;font-weight:800;color:#fff;text-decoration:none}
nav{display:flex;gap:4px}
nav a,.lk{color:#fff;text-decoration:none;font:inherit;font-weight:600;background:none;border:0;padding:8px 12px;border-radius:999px;cursor:pointer}
nav a:hover,.lk:hover{background:rgba(255,255,255,.18)}
.lk{background:var(--y);color:var(--yi)}
.lk:hover{background:var(--y);filter:brightness(1.06)}
a:focus-visible,button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--y);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding:44px 0 36px}
h1{font-size:clamp(2rem,6vw,3.5rem);font-weight:800;color:var(--g)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:var(--y)}}
:root[data-theme="dark"] h1{color:var(--y)}
.hero p{font-size:1.15rem;color:var(--mut);max-width:46ch;margin:16px 0 22px}
.cta{display:inline-block;background:var(--g);color:#fff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:999px}
.hi{aspect-ratio:4/3;border-radius:28px 28px 28px 80px;overflow:hidden;background:var(--soft);display:grid;place-items:center;border:4px solid var(--y)}
.hi img{width:100%;height:100%;object-fit:cover}
.hph{font-size:4rem}
h2{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800;margin:12px 0 22px}
.sec{margin-bottom:34px}
h3{display:inline-flex;align-items:center;gap:8px;background:var(--y);color:var(--yi);font-size:1.2rem;font-weight:800;padding:6px 16px 6px 12px;border-radius:8px 22px 22px 8px;margin-bottom:14px}
.nm{outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-bottom:16px;border-bottom:6px solid var(--bd)}
.pr{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pr img,.ni{width:100%;aspect-ratio:1;object-fit:cover;display:grid;place-items:center;background:var(--soft);font-size:2.4rem}
.pr b{padding:10px 12px;text-align:center;font-weight:600}
.pr input[data-j]:not([type=file]){margin:8px 8px 4px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;width:calc(100% - 16px)}
.row{display:flex;gap:6px;padding:4px 8px 10px}
.btn,.add,.row button,.x,#bar button{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--ink);padding:6px 12px}
.row>*{flex:1;text-align:center;font-size:.9rem}
.add{margin-top:12px;border-style:dashed}
.x{background:none;border:0;padding:0 0 0 4px}
.mut{color:var(--mut);margin:4px 0 8px;grid-column:1/-1}
.tools{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
[contenteditable="true"]{outline:2px dashed var(--y);outline-offset:4px;border-radius:6px}
footer{background:var(--g);color:#fff;text-align:center;padding:30px 20px;margin-top:20px}
footer a{color:var(--y);font-family:"Baloo 2",system-ui,sans-serif;font-size:1.8rem;font-weight:800;text-decoration:none}
footer p{margin:6px 0}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--ink);color:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
#bar span{flex:1;min-width:160px;font-weight:600}
#bar #save{background:var(--y);color:var(--yi);border-color:var(--y)}
[hidden]{display:none!important}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);padding:24px;width:min(340px,90vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{background:none;padding:0;color:var(--ink)}
dialog input{width:100%;padding:10px;margin:14px 0 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
#err{color:#c0392b;margin:0 0 8px}
.dr{display:flex;gap:8px;justify-content:flex-end}
.dr button{font:inherit;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer}
.dr #go{background:var(--g);color:#fff;border-color:var(--g)}
@media(max-width:700px){.hero{grid-template-columns:1fr;padding-top:28px}}
</style>
<script id="site-data" type="application/json">{"title":"¡Todo lo que buscas en un solo lugar! 🛒🍬🥦","desc":"Encuentra dulces, verduras, abarrotes, servicio de impresiones y mucho más. ¡Visítanos y disfruta de nuestros productos y servicios!","catTitle":"Productos que puedes encontrar","hero":"","sections":[{"e":"🍬","n":"Dulcería","p":[]},{"e":"🥩","n":"Carnes","p":[]},{"e":"🛒","n":"Abarrotes","p":[]},{"e":"🥫","n":"Enlatados","p":[]},{"e":"🥤","n":"Bebidas y gaseosas","p":[]},{"e":"🥦","n":"Verduras","p":[]},{"e":"🧽","n":"Productos de Aseo del Hogar","p":[]},{"e":"🐶","n":"Alimentos para mascotas","p":[]},{"e":"🧴","n":"Productos de Aseo personal","p":[]},{"e":"💊","n":"Medicamentos","p":[]},{"e":"✏️","n":"Papelería","p":[]},{"e":"🍷","n":"Licorería","p":[]},{"e":"🥡","n":"Artículos monouso","p":[]},{"e":"💅","n":"Cuidado de las Uñas","p":[]}]}</script>
</head>
<body>
<header>
<a class="brand" href="#inicio">🌾 Tienda Mixta Naturavena</a>
<nav><a href="#inicio">Inicio</a><a href="#catalogo">Catálogo</a><a href="#contacto">Contacto</a><button class="lk" id="own">Dueño</button></nav>
</header>
<main class="wrap">
<section id="inicio" class="hero">
<div>
<h1 id="t"></h1>
<p id="d"></p>
<a class="cta" href="#catalogo">Ver productos</a>
<div class="tools" id="ht" hidden><label class="btn">Cambiar imagen<input id="hf" type="file" accept="image/*" hidden></label><button class="btn" id="hx">Quitar imagen</button></div>
</div>
<div class="hi"><img id="hm" alt="Tienda Mixta Naturavena" hidden><div class="hph" id="hp">🛒🍬🥦</div></div>
</section>
<section id="catalogo"><h2 id="ct"></h2><div id="secs"></div></section>
</main>
<footer id="contacto">
<p>Para más información comunícate con nosotros</p>
<a href="tel:3122411782">📞 3122411782</a>
<p>Tienda Mixta Naturavena</p>
</footer>
<div id="bar" hidden><span id="msg">Modo dueño: edita y luego guarda</span><button id="save">Guardar cambios</button><button id="cx">Cancelar</button><button id="out">Salir</button></div>
<dialog id="lg"><h3>Acceso del dueño</h3><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><p id="err" hidden>Contraseña incorrecta.</p><div class="dr"><button id="no">Cerrar</button><button id="go">Entrar</button></div></dialog>
<script>
const SRC='<!DOCTYPE html>'+document.documentElement.outerHTML;
const S=JSON.parse(document.getElementById('site-data').textContent);
const H='1751c035bc7233a6d276dd667250a02c45efd05bc3aa77be9946d9378f3c6085';
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let own=false;
try{own=sessionStorage.getItem('nv')==='1'}catch(e){}
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const pic=(f,max)=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const k=Math.min(1,max/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=Math.round(m.width*k);c.height=Math.round(m.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(m,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};m.src=r.result};r.readAsDataURL(f)});
const build=()=>SRC.replace(/(<script id="site-data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+JSON.stringify(S).replace(/</g,'\\u003c')+b);
function fill(){
 [['#t','title'],['#d','desc'],['#ct','catTitle']].forEach(([s,k])=>{const e=$(s);e.textContent=S[k];e.contentEditable=own;e.oninput=()=>{S[k]=e.innerText.trim()}});
 $('#hm').hidden=!S.hero;$('#hp').hidden=!!S.hero;if(S.hero)$('#hm').src=S.hero;
 $('#ht').hidden=!own;$('#bar').hidden=!own;document.body.classList.toggle('own',own);
}
const prod=(p,i,j)=>`<div class="pr">${p.i?`<img src="${p.i}" alt="${esc(p.n)}">`:'<div class="ni">🛍️</div>'}${own?`<input value="${esc(p.n)}" placeholder="Nombre del producto" data-i="${i}" data-j="${j}"><div class="row"><label class="btn">Imagen<input type="file" accept="image/*" hidden data-i="${i}" data-j="${j}"></label><button data-a="dp" data-i="${i}" data-j="${j}">Quitar</button></div>`:`<b>${esc(p.n)}</b>`}</div>`;
function secs(){
 $('#secs').innerHTML=S.sections.map((s,i)=>`<section class="sec"><h3><span>${s.e}</span><span class="nm"${own?` contenteditable="true" data-i="${i}"`:''}>${esc(s.n)}</span>${own?`<button class="x" data-a="ds" data-i="${i}" title="Eliminar sección">🗑️</button>`:''}</h3><div class="grid">${s.p.map((p,j)=>prod(p,i,j)).join('')||(own?'':'<p class="mut">Pronto tendremos productos aquí.</p>')}</div>${own?`<button class="add" data-a="ap" data-i="${i}">+ Agregar producto</button>`:''}</section>`).join('')+(own?'<button class="add" data-a="as">+ Agregar sección</button>':'');
}
$('#secs').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=+b.dataset.i,j=+b.dataset.j,a=b.dataset.a;
 if(a==='ap'){S.sections[i].p.push({n:'',i:''});secs();const q=document.querySelectorAll(`input[data-i="${i}"][data-j]:not([type=file])`);q[q.length-1]?.focus()}
 if(a==='dp'){S.sections[i].p.splice(j,1);secs()}
 if(a==='ds'){S.sections.splice(i,1);secs()}
 if(a==='as'){S.sections.push({e:'🛍️',n:'Nueva sección',p:[]});secs()}
});
$('#secs').addEventListener('input',e=>{const t=e.target,i=+t.dataset.i;
 if(t.matches('input[data-j]:not([type=file])'))S.sections[i].p[+t.dataset.j].n=t.value;
 else if(t.classList.contains('nm'))S.sections[i].n=t.innerText.trim()});
$('#secs').addEventListener('change',async e=>{const t=e.target;if(t.type!=='file'||!t.files[0])return;S.sections[+t.dataset.i].p[+t.dataset.j].i=await pic(t.files[0],520);secs()});
$('#hf').onchange=async e=>{if(e.target.files[0]){S.hero=await pic(e.target.files[0],1200);fill()}};
$('#hx').onclick=()=>{S.hero='';fill()};
$('#own').onclick=()=>{if(own){scrollTo(0,0);return}$('#err').hidden=true;$('#lg').showModal();$('#pw').focus()};
$('#no').onclick=()=>$('#lg').close();
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#go').onclick=async()=>{
 if(await sha($('#pw').value)===H){own=true;try{sessionStorage.setItem('nv','1')}catch(e){}$('#lg').close();$('#pw').value='';fill();secs()}
 else $('#err').hidden=false};
$('#cx').onclick=()=>location.reload();
$('#out').onclick=()=>{try{sessionStorage.removeItem('nv')}catch(e){}location.reload()};
$('#save').onclick=async()=>{
 const b=$('#save');b.disabled=true;$('#msg').textContent='Guardando…';
 try{const a=await window.claude?.use('artifact');if(!a)throw{code:'none'};await a.publish(build())}
 catch(e){b.disabled=false;$('#msg').textContent=e&&['none','not_writer','not_granted'].includes(e.code)?'No se pudo guardar: abre esta página con la cuenta de Claude que la creó.':'No se pudo guardar. Intenta de nuevo.'}};
fill();secs();
</script>
</body>
</html>
